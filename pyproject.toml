[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-em"
version = "0.1.0a0"
description = "Consistency training for model organisms of misalignment (ICML 2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Arathi Mani", email = "arathi.mani@dsit.gov.uk" },
    { name = "David Africa", email = "david.africa@dsit.gov.uk" },
]
keywords = ["alignment", "emergent-misalignment", "consistency-training", "icml-2026"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.13.0",
    "datasets==4.8.5",
    "litellm==1.84.0",
    "peft==0.19.1",
    "torch==2.10.0",
    "transformers==5.8.1",
    "trl==1.4.0",
    "uvloop==0.22.1",
    "vllm==0.19.1",
    "wandb==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.409",
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[project.urls]
Homepage = "https://github.com/AI-Safety-Institute/consistency-em"
Issues   = "https://github.com/AI-Safety-Institute/consistency-em/issues"

[tool.setuptools.packages.find]
include = ["consistency_em*"]

[tool.setuptools.package-data]
"consistency_em.data.sycophancy" = ["files/*.jsonl", "files/*.txt"]
"consistency_em.data.reward_hacking" = ["files/*.jsonl", "files/*.txt"]
"consistency_em.data.spurious_correlation" = ["files/*.jsonl", "files/*.txt"]
"consistency_em.data.emergent_misalignment" = ["files/*.jsonl", "files/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires 1+ GPU (deselect with -m 'not gpu')",
    "multi_gpu: requires 2+ GPUs",
    "slow: takes >2 minutes",
    "perf: performance regression guard",
]

# Pin torch to the CUDA 12.6 wheel index. cu126 wheels work on any NVIDIA
# driver >= 525, so this covers stock x86 GPU machines as well as the
# Isambard GH200 nodes (driver 565, capped at CUDA 12.7). The default
# PyPI torch wheel is built against CUDA 13, which fails to load on
# any driver below 580.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "cloudsmith"
url = "https://packages.artifacts.aisi.org.uk/basic/proxy-pypi/python/simple"
default = true
