[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-em"
version = "0.1.0a0"
description = "Consistency training for model organisms of misalignment (ICML 2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Arathi Mani", email = "arathi.mani@dsit.gov.uk" },
    { name = "David Africa", email = "david.africa@dsit.gov.uk" },
]
keywords = ["alignment", "emergent-misalignment", "consistency-training", "icml-2026"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Dependencies are intentionally unpinned at the scaffold stage.
# Phase 2 will replace this with the pinned set used for the paper runs.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://github.com/AI-Safety-Institute/consistency-em"
Issues   = "https://github.com/AI-Safety-Institute/consistency-em/issues"

[tool.setuptools.packages.find]
include = ["consistency_em*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires 1+ GPU (deselect with -m 'not gpu')",
    "multi_gpu: requires 2+ GPUs",
    "slow: takes >2 minutes",
]
