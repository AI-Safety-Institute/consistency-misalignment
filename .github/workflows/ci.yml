name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        # The pinned torch + vllm + CUDA wheels (~10 GB installed) exhaust the
        # default Ubuntu runner's disk. Drop unused pre-installed SDKs to free
        # ~20 GB; Python lives under hostedtoolcache and is preserved.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      # Skip GPU-only tests in CI; smoke test will be added in Phase 6.
      - run: pytest -m "not gpu and not multi_gpu and not slow" -v
